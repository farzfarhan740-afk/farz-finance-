<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<title>Farzz Finance</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e1b4b, #4f46e5);
  color: white;
}

/* NAVBAR */
nav {
  display: flex;
  justify-content: space-between;
  padding: 15px 20px;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
}

nav a {
  color: white;
  margin-left: 15px;
  text-decoration: none;
}

/* CONTAINER */
.container {
  padding: 20px;
}

/* CARD */
.box {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  padding: 20px;
  border-radius: 15px;
  margin-top: 20px;
  border: 1px solid rgba(255,255,255,0.1);
}

/* INPUT */
input {
  padding: 10px;
  border-radius: 8px;
  border: none;
  margin: 5px;
  background: rgba(255,255,255,0.1);
  color: white;
}

/* BUTTON UNGU STARTUP */
button {
  padding: 12px 20px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #7c3aed, #6366f1);
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px #7c3aed;
}

/* DASHBOARD */
#persen {
  font-size: 40px;
  color: #a78bfa;
}
</style>
</head>

<body>

<nav>
  <h2>Farzz Finance</h2>
  <div>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    
  </div>
</nav>

<!-- DASHBOARD -->
<div class="container">
  <div class="box">
    <h2>Dashboard</h2>
    <h1 id="persen">0%</h1>
    <canvas id="chart"></canvas>
  </div>
</div>

<!-- TOOLS -->
<div class="container">

<h1>💰 Finance Tools</h1>

<div class="box">
  <h3>Kalkulator Bunga</h3>
  <input type="number" id="uang" placeholder="Uang awal">
  <input type="number" id="bulan" placeholder="Bulan">
  <input type="number" id="bunga" placeholder="Bunga %">
  <h2 id="hasil"></h2>
</div>

<div class="box">
  <h3>Kalkulator Nabung</h3>
  <input type="number" id="nabung" placeholder="Nabung per bulan">
  <input type="number" id="bulan2" placeholder="Jumlah bulan">
  <h2 id="hasil2"></h2>
</div>

<div class="box">
  <h3>Kalkulator Pengeluaran</h3>
  <input type="number" id="gaji" placeholder="Gaji">
  <input type="number" id="pengeluaran" placeholder="Pengeluaran">
  <h2 id="hasil3"></h2>
</div>
  
  <div class="box">
  <h3>🎥 Video Edukasi Finansial</h3>

  <blockquote class="tiktok-embed" cite="https://www.tiktok.com/@tiktok/video/ZSxKFwcJf" data-video-id="ZSxKFwcJf" style="max-width: 605px;min-width: 325px;">
    <section></section>
  </blockquote>

  <script async src="https://www.tiktok.com/embed.js"></script>
</div>

  
<div class="box">
  <h3>Belajar Finansial</h3>
  <p>Mulai dari kecil dan konsisten.</p>
  <a href="https://s.shopee.co.id/7KuEiPmcM4" target="_blank">
    <button>Beli Buku</button>
  </a>
</div>

</div>

<script>
function formatRupiah(angka) {
  return "Rp " + angka.toLocaleString("id-ID");
}

let chart;

function updateDashboard(data) {
  let terakhir = data[data.length - 1] || 0;
  let persen = Math.min(100, Math.round((terakhir / 1000000) * 100));
  document.getElementById("persen").innerText = persen + "%";

  const ctx = document.getElementById('chart').getContext('2d');

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.map((_, i) => i+1),
      datasets: [{
        data: data,
        borderWidth: 3,
        tension: 0.4
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "white" } },
        y: { ticks: { color: "white" } }
      }
    }
  });
}

function hitungSemua() {
  let uang = parseFloat(document.getElementById("uang").value) || 0;
  let bulan = parseFloat(document.getElementById("bulan").value) || 0;
  let bunga = (parseFloat(document.getElementById("bunga").value) || 0) / 100;

  let total = uang;
  let data = [];

  for (let i = 0; i < bulan; i++) {
    total += total * bunga;
    data.push(Math.round(total));
  }

  document.getElementById("hasil").innerText = formatRupiah(total);
  updateDashboard(data);

  let nabung = parseFloat(document.getElementById("nabung").value) || 0;
  let bulan2 = parseFloat(document.getElementById("bulan2").value) || 0;
  document.getElementById("hasil2").innerText = formatRupiah(nabung * bulan2);

  let gaji = parseFloat(document.getElementById("gaji").value) || 0;
  let pengeluaran = parseFloat(document.getElementById("pengeluaran").value) || 0;
  document.getElementById("hasil3").innerText = formatRupiah(gaji - pengeluaran);
}

document.querySelectorAll("input").forEach(i => i.addEventListener("input", hitungSemua));
</script>

</body>
</html>
